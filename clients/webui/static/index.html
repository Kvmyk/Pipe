<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Pipe</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill-rule="evenodd" d="M4 8a4 4 0 0 1 4-4h5a5 5 0 0 1 0 10H9v6H4zm9-1.2a2.2 2.2 0 1 0 0 4.4 2.2 2.2 0 0 0 0-4.4z" fill="currentColor"/></svg>
      <span>Pipe</span>
    </div>
    <div class="server-pill" id="server-pill" title=""><span class="dot" id="link-dot"></span><span id="server-name"></span></div>
    <div class="spacer"></div>
    <nav class="mobile-switch" id="mobile-switch" aria-label="widok">
      <button data-pane="chat" class="on" id="tab-chat"></button>
      <button data-pane="stage" id="tab-stage"></button>
    </nav>
    <button class="icon stage-toggle" id="stage-toggle" type="button" aria-label="panel" aria-pressed="true" aria-controls="stage-pane">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 5h16v14H4zM14 5v14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path class="fill" d="M14 5h6v14h-6z" fill="currentColor" opacity=".35"/></svg>
    </button>
    <button class="icon lang" id="lang" aria-label="language"></button>
    <button class="icon" id="theme" aria-label="theme">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
    <button class="ghost" id="new-chat"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg><span id="new-chat-label"></span></button>
  </header>

  <main class="layout" id="layout" data-pane="chat">
    <section class="chat" id="chat-pane" aria-label="chat">
      <div class="messages" id="messages" aria-live="polite"></div>
      <div class="working" id="working" hidden>
        <span class="orb"><i></i><i></i><i></i></span><span id="working-text"></span>
      </div>
      <div class="chips" id="chips">
        <button type="button" class="yolo-chip" id="yolo-chip" hidden>YOLO</button>
        <button type="button" class="model-pill" id="model-pill" aria-haspopup="listbox" aria-expanded="false" hidden>
          <span class="swap"><span id="model-pill-badge"></span><b id="model-pill-name"></b><span id="model-pill-model"></span></span>
          <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="palette model-menu" id="model-menu" role="listbox" hidden><div class="palette-glow" id="model-menu-glow"></div><div class="palette-list" id="model-menu-list"></div></div>
      <div class="palette" id="palette" role="listbox" hidden><div class="palette-glow" id="palette-glow"></div><div class="palette-list" id="palette-list"></div></div>
      <form class="composer" id="composer" autocomplete="off">
        <textarea id="input" rows="1"></textarea>
        <button type="submit" id="send" class="primary" aria-label="send">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12l15-7-5 16-3-7z" fill="currentColor"/></svg>
        </button>
      </form>
    </section>

    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0" aria-controls="stage-pane"></div>

    <section class="stage" id="stage-pane" aria-label="stage">
      <div class="stage-tabs" role="tablist">
        <button role="tab" data-tab="map" class="on" id="st-map"></button>
        <button role="tab" data-tab="changes" id="st-changes"><span id="st-changes-label"></span><b class="badge" id="changes-badge" hidden>0</b></button>
        <button role="tab" data-tab="skills" id="st-skills"></button>
        <button role="tab" data-tab="alerts" id="st-alerts"><span id="st-alerts-label"></span><b class="badge warn" id="alerts-badge" hidden>0</b></button>
        <div class="spacer"></div>
        <button class="icon stage-hide" id="stage-hide" type="button" aria-label="hide panel">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 5h16v14H4zM14 5v14M8.5 10l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="tab-body" id="tab-map">
        <div class="map-bar">
          <nav class="crumbs" id="crumbs" aria-label="breadcrumb"></nav>
          <div class="spacer"></div>
          <button class="follow on" id="follow" aria-pressed="true">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
            <span id="follow-label"></span>
          </button>
          <button class="icon" id="fit" aria-label="fit">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </button>
          <button class="icon" id="refresh" aria-label="refresh">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </button>
        </div>
        <div class="map" id="map">
          <svg id="graph" xmlns="http://www.w3.org/2000/svg" role="img">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 8.5 5 1 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
            </defs>
            <g id="camera"><g id="edges"></g><g id="pulses"></g><g id="nodes"></g></g>
          </svg>
          <div class="map-empty" id="map-empty" hidden></div>
          <aside class="detail" id="detail" hidden></aside>
        </div>
        <div class="timeline-head" id="timeline-head"></div>
        <div class="timeline" id="timeline"></div>
      </div>

      <div class="tab-body" id="tab-changes" hidden><div class="list" id="changes"></div></div>
      <div class="tab-body" id="tab-skills" hidden><div class="list" id="skills"></div></div>
      <div class="tab-body" id="tab-alerts" hidden><div class="list" id="alerts"></div></div>
    </section>
  </main>

  <div class="sheet" id="setup" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="setup-title">
      <button class="icon close" id="setup-close" type="button">×</button>
      <div class="steps">
        <section class="step" id="step-pick">
          <h2 id="setup-title"></h2>
          <p class="lead" id="setup-lead"></p>
          <div class="provider-grid" id="provider-grid"></div>
          <div class="sheet-foot"><span class="hint" id="setup-hint"></span><div class="spacer"></div><button class="btn no" id="setup-skip" type="button"></button></div>
        </section>
        <section class="step away" id="step-key" inert></section>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="lightbox" id="lightbox" hidden><img alt=""></div>

  <script type="application/json" id="pipe-config">__PIPE_CONFIG__</script>
  <script src="/static/theme.js"></script>
  <script src="/static/i18n.js"></script>
  <script src="/static/md.js"></script>
  <script src="/static/graph.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
