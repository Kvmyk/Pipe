services:
  vps-agent:
    build: .
    restart: unless-stopped
    volumes:
      # Konfiguracja (tylko do odczytu)
      - ./.env:/app/.env:ro
      # Unix socket — wspólny z hostem i innymi kontenerami (Telegram bot)
      - /tmp:/tmp
      # Audit log — persystowany na hoście
      - ~/.vps_agent_audit.log:/app/audit.log
      # Docker socket — by agent mógł zarządzać kontenerami na Mikrusie
      - /var/run/docker.sock:/var/run/docker.sock
      # GŁÓWNY DYSK HOST (Pełny dostęp) - Agent może modyfikować pliki hosta
      - /:/hostfs
    ports:
      # TCP dla SSH tunnel — bindowany TYLKO na localhost serwera
      # Dostęp z laptopa: ssh -L 7379:127.0.0.1:7379 user@serwer
      - "127.0.0.1:7379:7379"
    environment:
      - LLM_BASE_URL
      - LLM_API_KEY
      - LLM_MODEL
      - AUDIT_LOG_PATH=/app/audit.log
      - AGENT_SOCKET=/tmp/vps-agent.sock
      - TCP_HOST=0.0.0.0
      - TCP_PORT=7379
    network_mode: bridge

  telegram:
    build: 
      context: ..
      dockerfile: clients/telegram/Dockerfile
    restart: unless-stopped
    depends_on:
      - vps-agent
    volumes:
      # Podpinamy zmienne środowiskowe do zarządzania tokenem
      - ../clients/telegram/.env:/app/clients/telegram/.env:ro
      # Wspólny socket plikowy do gadania z vps-agentem
      - /tmp:/tmp
    network_mode: bridge
