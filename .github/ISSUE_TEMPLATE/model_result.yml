name: Model result / Wynik modelu
description: Eval results for a model. / Wyniki `sandbox/run.py eval` dla modelu, którego jeszcze nie sprawdzaliśmy.
labels: [eval]
body:
  - type: markdown
    attributes:
      value: |
        `python3 sandbox/run.py eval --env-file backend/.env --repeat 3 --label <model>` — see `sandbox/README.md`.
  - type: input
    id: model
    attributes:
      label: Provider and model / Provider i model
      placeholder: "openrouter / openai/gpt-oss-120b"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary line / Podsumowanie
      render: text
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: JSON from `sandbox/results/`
      render: json
  - type: textarea
    id: notes
    attributes:
      label: Notes / Uwagi
      description: What it did well or badly, what it cost. / Co model robił dobrze albo źle, ile kosztowało.
