name: Błąd / Bug report
description: Pipe zrobił coś innego, niż powinien. / Pipe did something it shouldn't have.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Możesz pisać po polsku albo po angielsku. Nie wklejaj kluczy API, tokenów ani haseł.
        Podatność (np. komenda, która zmienia serwer bez potwierdzenia) zgłoś prywatnie: SECURITY.md.

        Polish or English is fine. Don't paste API keys, tokens or passwords.
        Report vulnerabilities (e.g. a command that changes the server without confirmation) privately: SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: Co się stało / What happened
      description: Co napisałeś, co zrobił Pipe, czego się spodziewałeś. / What you asked, what Pipe did, what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Jak to powtórzyć / How to reproduce
      description: Kroki albo scenariusz z piaskownicy (`sandbox/`), jeśli się da. / Steps, or a sandbox scenario if possible.
  - type: input
    id: version
    attributes:
      label: Wersja / Version
      description: Plik `VERSION` albo baner CLI. / The `VERSION` file or the CLI banner.
      placeholder: "X.Y.Z"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Tryb / Mode
      options: [docker, native, kubernetes, sandbox]
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Klient / Client
      multiple: true
      options: [CLI, pipe web, Telegram, MCP]
  - type: input
    id: model
    attributes:
      label: Provider i model / Provider and model
      placeholder: "gemini / gemini-3.8-flash"
  - type: textarea
    id: logs
    attributes:
      label: Logi / Logs
      description: "`docker compose logs vps-agent` albo `journalctl -u pipe`. Sprawdź, czy nie ma w nich sekretów. / Check them for secrets first."
      render: text
