services:
  vps-agent:
    build: .
    restart: unless-stopped
    pid: host
    volumes:
      # Konfiguracja (tylko do odczytu)
      - ./.env:/app/.env:ro
      # Dane utrwalane (np. audit log)
      - ./data:/app/data
      # Unix socket — wspólny z hostem i innymi kontenerami (Telegram bot)
      - /tmp:/tmp
      # Caly system plikow VPS (read-only) — agent moze nawigowac i czytac wszystko
      - /:/hostfs:ro
      # Katalog domowy — zapis dozwolony (overlay na ro mount powyzej)
      - /root:/hostfs/root
      # Strefa czasowa hosta — bez tego kontener liczy czas w UTC ("przypomnij o 9" i poranny raport
      # przychodzilyby o innej godzinie niz na zegarze serwera). Inna strefa: TZ=Europe/Warsaw w backend/.env.
      - /etc/localtime:/etc/localtime:ro
      # Proc hosta VPS — aby agent czytał statystyki z poziomu VPS, a nie maszyny fizycznej
      - /proc:/hostproc:ro
      # Docker socket - aby agent mogl zarzadzac kontenerami!
      - /var/run/docker.sock:/var/run/docker.sock
      # Klucze SSH (git, zdalne cele ssh) — tylko do odczytu; known_hosts celow trafia do /app/data
      - /root/.ssh:/root/.ssh:ro
      # Opcjonalnie: kubeconfig dla celow-klastrow Kubernetes (odkomentuj, jesli masz)
      # - /root/.kube:/root/.kube:ro
    extra_hosts:
      # Uslugi na hoscie (np. Ollama) sa widoczne z kontenera jako host.docker.internal
      - "host.docker.internal:host-gateway"
    ports:
      # TCP dla SSH tunnel — bindowany TYLKO na localhost serwera
      - "127.0.0.1:7379:7379"
      # Webhooki (alerty z Alertmanagera, Uptime Kuma, GitHuba...) — dziala po ustawieniu WEBHOOK_PORT=7380
      # i WEBHOOK_TOKEN w .env; tylko localhost (odwrotne proxy z TLS, jesli nadawca jest poza serwerem)
      - "127.0.0.1:7380:7380"
      # MCP (Streamable HTTP) dla agentow na serwerze — dziala po ustawieniu MCP_PORT=7381;
      # z laptopa wygodniej: most stdio `pipe --mcp --host root@serwer` (bez tego portu)
      - "127.0.0.1:7381:7381"
    # Wszystkie ustawienia z backend/.env (progi czuwania, raport, ceny, webhooki...) trafiaja do kontenera;
    # ponizsze `environment` nadpisuje to, co zalezy od kontenera (sciezki, adresy nasluchu).
    env_file:
      - .env
    environment:
      # Tryb dzialania: host pod /hostfs, /proc hosta pod /hostproc (patrz backend/core/runtime.py)
      - PIPE_RUNTIME=docker
      - LLM_PROVIDER
      - LLM_BASE_URL
      - LLM_API_KEY
      - LLM_MODEL
      - LLM_REASONING_EFFORT
      - LLM_TIMEOUT
      # Wlasni providerzy dodani kreatorem (backend/data/providers.json na hoscie)
      - LLM_PROVIDERS_FILE=/app/data/providers.json
      # Pamiec agenta: SERVER.md i skille (backend/data na hoscie)
      - DATA_DIR=/app/data
      - AGENT_TOKEN
      # Workery (pod-agenty) — opcjonalnie tanszy model; czuwanie i VIBE (backend/.env.example)
      - WORKER_MODEL
      - WATCH_ENABLED
      - WATCH_INTERVAL
      - WATCH_DISK_PCT
      - WATCH_MEM_PCT
      - VIBE_EVERY
      - REDACT_SECRETS
      - CONFIRMED_COMMAND_TIMEOUT
      - AUDIT_LOG_PATH=/app/data/audit.log
      - AGENT_SOCKET=/tmp/vps-agent.sock
      - TCP_HOST=0.0.0.0
      - TCP_PORT=7379
      - WEBHOOK_HOST=0.0.0.0
      - MCP_HOST=0.0.0.0
    network_mode: bridge

  telegram:
    build: 
      context: ..
      dockerfile: clients/telegram/Dockerfile
    restart: unless-stopped
    depends_on:
      - vps-agent
    volumes:
      # Podpinamy zmienne środowiskowe do zarządzania tokenem
      - ../clients/telegram/.env:/app/clients/telegram/.env:ro
      # Wspólny socket plikowy do gadania z vps-agentem
      - /tmp:/tmp
      - /etc/localtime:/etc/localtime:ro
    environment:
      - AGENT_TOKEN
      - TZ
      - PIPE_LANG
      # 0 = bot nie przesyla alertow czuwania ani raportow rutyn
      - TELEGRAM_ALERTS
    network_mode: bridge


