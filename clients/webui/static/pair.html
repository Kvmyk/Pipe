<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="robots" content="noindex, nofollow">
  <title>Pipe</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="pair-page">
  <main class="pair" aria-live="polite">
    <div class="pair-brand">
      <img src="/static/icon.svg" width="32" height="32" alt="">
      <span id="pair-server"></span>
    </div>
    <h1 id="pair-title"></h1>
    <p class="pair-lead" id="pair-lead"></p>
    <div class="pair-code" id="pair-code" hidden></div>
    <p class="pair-hint" id="pair-hint" hidden></p>
    <p class="pair-status" id="pair-status" hidden></p>
    <button class="btn yes pair-btn" id="pair-btn" type="button"></button>
    <p class="pair-foot" id="pair-foot"></p>
  </main>
  <script type="application/json" id="pipe-config">__PIPE_CONFIG__</script>
  <script src="/static/theme.js"></script>
  <script src="/static/pair.js"></script>
</body>
</html>
