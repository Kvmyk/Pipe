services:
  vps-agent:
    build: .
    restart: unless-stopped
    volumes:
      # Konfiguracja (tylko do odczytu)
      - ./.env:/app/.env:ro
      # Unix socket — wspólny z hostem i innymi kontenerami (Telegram bot)
      - /tmp:/tmp
      # DEDYKOWANY WORKSPACE - Agent może operować TYLKO w tym katalogu
      # Zakładamy, że /opt/pipeclaw-workspace istnieje i jest właściwy
      - /opt/pipeclaw-workspace:/hostfs
      # Docker socket - aby agent mogl zarzadzac kontenerami!
      - /var/run/docker.sock:/var/run/docker.sock
      # Klucze SSH do gita (tylko do odczytu)
      - /root/.ssh:/root/.ssh:ro
    ports:
      # TCP dla SSH tunnel — bindowany TYLKO na localhost serwera
      - "127.0.0.1:7379:7379"
    environment:
      - LLM_BASE_URL
      - LLM_API_KEY
      - LLM_MODEL
      - AUDIT_LOG_PATH=/app/audit.log
      - AGENT_SOCKET=/tmp/vps-agent.sock
      - TCP_HOST=0.0.0.0
      - TCP_PORT=7379
    network_mode: bridge
    pid: "host"

  telegram:
    build: 
      context: ..
      dockerfile: clients/telegram/Dockerfile
    restart: unless-stopped
    depends_on:
      - vps-agent
    volumes:
      # Podpinamy zmienne środowiskowe do zarządzania tokenem
      - ../clients/telegram/.env:/app/clients/telegram/.env:ro
      # Wspólny socket plikowy do gadania z vps-agentem
      - /tmp:/tmp
    network_mode: bridge

  host-stats:
    image: alpine:3.18
    restart: unless-stopped
    # Ten serwis czyta tylko /proc hosta (do odczytu) i zapisuje wyjscie do workspace
    # Workspace jest zamontowany na hoście jako /opt/pipeclaw-workspace
    volumes:
      - /opt/pipeclaw-workspace:/hostfs
      - /proc:/hostproc:ro
    command: >
      sh -c "mkdir -p /hostfs/tmp; \
      while true; do \
        # uptime & loadavg
        cat /hostproc/uptime > /hostfs/tmp/vps_uptime 2>/dev/null || true; \
        cat /hostproc/loadavg > /hostfs/tmp/vps_loadavg 2>/dev/null || true; \
        # memory: compute from /hostproc/meminfo to reflect host values
        awk 'BEGIN{mt=0;ma=0;buf=0;cache=0;sh=0} /^MemTotal:/ {mt=$$2} /^MemAvailable:/ {ma=$$2} /^Buffers:/ {buf=$$2} /^Cached:/ {cache=$$2} /^Shmem:/ {sh=$$2} END{mt_mb=int(mt/1024); ma_mb=int(ma/1024); used_mb=int((mt-ma)/1024); free_mb=int(ma/1024); printf("               total        used        free      shared  buff/cache   available\n"); printf("Mem: %11dM %11dM %8dM %8dM %10dM %10dM\n", mt_mb, used_mb, free_mb, int(sh/1024), int((buf+cache)/1024), ma_mb)}' /hostproc/meminfo > /hostfs/tmp/vps_free 2>/dev/null || true; \
        cp /hostproc/meminfo /hostfs/tmp/vps_meminfo 2>/dev/null || true; \
        # cpu snapshot
        top -bn1 | head -20 > /hostfs/tmp/vps_stats_cpu.txt 2>/dev/null || true; \
        # proc/stat
        cp /hostproc/stat /hostfs/tmp/vps_stat 2>/dev/null || true; \
        # disk
        df -h / > /hostfs/tmp/vps_disk 2>/dev/null || true; \
        # combined friendly status: include uptime, vps_free, disk
        echo "=== UPTIME ===" > /hostfs/tmp/vps_stats.txt 2>/dev/null || true; uptime >> /hostfs/tmp/vps_stats.txt 2>/dev/null || true; \
        echo "\n=== FREE ===" >> /hostfs/tmp/vps_stats.txt 2>/dev/null || true; cat /hostfs/tmp/vps_free >> /hostfs/tmp/vps_stats.txt 2>/dev/null || true; \
        echo "\n=== DISK ===" >> /hostfs/tmp/vps_stats.txt 2>/dev/null || true; df -h / | head -5 >> /hostfs/tmp/vps_stats.txt 2>/dev/null || true; \
        sleep 60; \
      done"
    network_mode: bridge
